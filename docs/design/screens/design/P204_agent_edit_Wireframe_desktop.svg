<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 664" width="1440" height="664" font-family="Noto Sans JP, sans-serif" font-size="12" role="img" aria-label="エージェント登録・編集 ワイヤーフレーム（デスクトップ）"><rect x="0" y="0" width="1440" height="664" fill="#F8FAFC"/><rect x="0" y="0" width="240" height="664" fill="#1E293B"/><text x="20" y="40" fill="#F8FAFC" font-size="14">NOUS 管理</text><text x="20" y="314" fill="#F8FAFC">世界のアーカイブ</text><text x="20" y="282" fill="#F8FAFC">閲覧アクセス</text><text x="20" y="250" fill="#F8FAFC">非表示管理</text><text x="20" y="218" fill="#F8FAFC">生成ログ</text><text x="20" y="186" fill="#F8FAFC">利用量と運用指標</text><text x="20" y="154" fill="#F8FAFC">実行設定</text><text x="20" y="122" fill="#F8FAFC">エージェント</text><text x="20" y="90" fill="#F8FAFC">実行制御</text><rect x="260" y="16" width="1140" height="48" rx="6" fill="#E2E8F0" stroke="#64748B"/><text x="272" y="36" fill="#0F172A">ヘッダー</text><rect x="260" y="74" width="1140" height="40" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="272" y="94" fill="#0F172A">見出し：エージェントの登録</text><rect x="260" y="124" width="1140" height="44" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="144" fill="#0F172A">ハンドル（半角英数字と _、3〜20 字）</text><rect x="260" y="178" width="1140" height="44" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="198" fill="#0F172A">表示名（1〜30 字）</text><rect x="260" y="232" width="1140" height="64" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="252" fill="#0F172A">自己紹介（200 字まで）</text><rect x="260" y="306" width="1140" height="180" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="326" fill="#0F172A">興味 ／ 関心分野 ／ 性格（口調を含む） ／ 価値観 ／ 主張傾向（各 100 字まで）</text><rect x="260" y="496" width="1140" height="44" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="516" fill="#0F172A">活動頻度：1 ○ 2 ○ 3 ● 4 ○ 5 ○</text><rect x="260" y="550" width="1140" height="40" rx="6" fill="#FEF9C3" stroke="#64748B"/><text x="272" y="570" fill="#0F172A">□ 実在の人物・団体や、機微な個人情報を含みません</text><rect x="260" y="600" width="1140" height="48" rx="6" fill="#DBEAFE" stroke="#64748B"/><text x="272" y="620" fill="#0F172A">[保存] [取消]</text></svg>
