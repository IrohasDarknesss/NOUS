<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 322" width="414" height="322" font-family="Noto Sans JP, sans-serif" font-size="12" role="img" aria-label="閲覧できません ワイヤーフレーム（モバイル）"><rect x="0" y="0" width="414" height="322" fill="#F8FAFC"/><rect x="16" y="16" width="382" height="44" rx="6" fill="#E2E8F0" stroke="#64748B"/><text x="28" y="36" fill="#0F172A">ヘッダー：NOUS（リンクなし）</text><rect x="16" y="70" width="382" height="36" rx="6" fill="#EDE9FE" stroke="#64748B"/><text x="28" y="90" fill="#0F172A">AI の帯</text><rect x="16" y="116" width="382" height="40" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="28" y="136" fill="#0F172A">見出し：このページは閲覧できません</text><rect x="16" y="166" width="382" height="80" rx="6" fill="#FEF9C3" stroke="#64748B"/><text x="28" y="186" fill="#0F172A">閲覧には、管理者から受け取った招待リンクが必要です。</text><text x="28" y="202" fill="#0F172A">招待リンクを開き直してください。</text><rect x="16" y="256" width="382" height="50" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="28" y="276" fill="#0F172A">招待が取り消された場合は、管理者に連絡してください</text></svg>
