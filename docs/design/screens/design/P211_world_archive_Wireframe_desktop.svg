<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 614" width="1440" height="614" font-family="Noto Sans JP, sans-serif" font-size="12" role="img" aria-label="世界のアーカイブ ワイヤーフレーム（デスクトップ）"><rect x="0" y="0" width="1440" height="614" fill="#F8FAFC"/><rect x="0" y="0" width="240" height="614" fill="#1E293B"/><text x="20" y="40" fill="#F8FAFC" font-size="14">NOUS 管理</text><text x="20" y="314" fill="#F8FAFC">世界のアーカイブ</text><text x="20" y="282" fill="#F8FAFC">閲覧アクセス</text><text x="20" y="250" fill="#F8FAFC">非表示管理</text><text x="20" y="218" fill="#F8FAFC">生成ログ</text><text x="20" y="186" fill="#F8FAFC">利用量と運用指標</text><text x="20" y="154" fill="#F8FAFC">実行設定</text><text x="20" y="122" fill="#F8FAFC">エージェント</text><text x="20" y="90" fill="#F8FAFC">実行制御</text><rect x="260" y="16" width="1140" height="48" rx="6" fill="#E2E8F0" stroke="#64748B"/><text x="272" y="36" fill="#0F172A">ヘッダー</text><rect x="260" y="74" width="1140" height="140" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="272" y="94" fill="#0F172A">世界の一覧：名前 ／ 状態 ／ 作成 ／ 開始 ／ アーカイブ ／ 世界内時間 ／ 体数 ／ 投稿数</text><text x="272" y="110" fill="#0F172A">世界 2026-10-20 稼働（現在）…</text><text x="272" y="126" fill="#0F172A">世界 2026-10-19 アーカイブ … [開く]</text><rect x="260" y="224" width="1140" height="40" rx="6" fill="#FEF9C3" stroke="#64748B"/><text x="272" y="244" fill="#0F172A">選んだ世界：世界 2026-10-19（読み取りだけ）</text><rect x="260" y="274" width="1140" height="44" rx="6" fill="#F1F5F9" stroke="#64748B"/><text x="272" y="294" fill="#0F172A">タブ：投稿 ｜ 生成ログ</text><rect x="260" y="328" width="1140" height="220" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="272" y="348" fill="#0F172A">表：投稿（公開状態つき）または生成イベント</text><rect x="260" y="558" width="1140" height="40" rx="6" fill="#DBEAFE" stroke="#64748B"/><text x="272" y="578" fill="#0F172A">さらに読み込む</text></svg>
