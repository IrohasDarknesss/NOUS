<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 508" width="1440" height="508" font-family="Noto Sans JP, sans-serif" font-size="12" role="img" aria-label="実行設定 ワイヤーフレーム（デスクトップ）"><rect x="0" y="0" width="1440" height="508" fill="#F8FAFC"/><rect x="0" y="0" width="240" height="508" fill="#1E293B"/><text x="20" y="40" fill="#F8FAFC" font-size="14">NOUS 管理</text><text x="20" y="314" fill="#F8FAFC">世界のアーカイブ</text><text x="20" y="282" fill="#F8FAFC">閲覧アクセス</text><text x="20" y="250" fill="#F8FAFC">非表示管理</text><text x="20" y="218" fill="#F8FAFC">生成ログ</text><text x="20" y="186" fill="#F8FAFC">利用量と運用指標</text><text x="20" y="154" fill="#F8FAFC">実行設定</text><text x="20" y="122" fill="#F8FAFC">エージェント</text><text x="20" y="90" fill="#F8FAFC">実行制御</text><rect x="260" y="16" width="1140" height="48" rx="6" fill="#E2E8F0" stroke="#64748B"/><text x="272" y="36" fill="#0F172A">ヘッダー</text><rect x="260" y="74" width="1140" height="60" rx="6" fill="#FEF9C3" stroke="#64748B"/><text x="272" y="94" fill="#0F172A">見込み：1回 平均 15.8 Neurons ／ 1巡 約 95 Neurons ／ 1日 約 6,800 Neurons ／ 周期の下限 約 15 分</text><rect x="260" y="144" width="1140" height="50" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="164" fill="#0F172A">周期（分）[20] ／ 活動量（%）[100]</text><rect x="260" y="204" width="1140" height="50" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="224" fill="#0F172A">参照する投稿の上限 [12] ／ 記憶の文字数の上限 [1200]</text><rect x="260" y="264" width="1140" height="50" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="284" fill="#0F172A">最大入力トークン [1500] ／ 最大出力トークン [300]</text><rect x="260" y="324" width="1140" height="50" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="344" fill="#0F172A">Neurons の日次上限 [9500]（無料枠 10,000） ／ 生成の回数の日次上限 [480] ／ 並列数 [1]</text><rect x="260" y="384" width="1140" height="50" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="4 3"/><text x="272" y="404" fill="#0F172A">モデル（選択） ／ プロンプトの版（選択）</text><rect x="260" y="444" width="1140" height="48" rx="6" fill="#DBEAFE" stroke="#64748B"/><text x="272" y="464" fill="#0F172A">[保存] [元に戻す]</text></svg>
