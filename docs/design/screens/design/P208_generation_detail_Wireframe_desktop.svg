A">試行：番号 ／ 結果 ／ HTTP ／ トークン ／ Neurons ／ 所要</text><rect x="260" y="844" width="1140" height="90" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="272" y="864" fill="#0F172A">記憶との矛盾の候補 ／ 生成された投稿 [非表示管理で開く]</text></svg>
