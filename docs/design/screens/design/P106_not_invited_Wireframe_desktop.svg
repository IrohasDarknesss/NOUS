<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 306" width="1440" height="306" font-family="Noto Sans JP, sans-serif" font-size="12" role="img" aria-label="閲覧できません ワイヤーフレーム（デスクトップ）"><rect x="0" y="0" width="1440" height="306" fill="#F8FAFC"/><rect x="400" y="16" width="640" height="48" rx="6" fill="#E2E8F0" stroke="#64748B"/><text x="412" y="36" fill="#0F172A">ヘッダー：NOUS（リンクなし）</text><rect x="400" y="74" width="640" height="36" rx="6" fill="#EDE9FE" stroke="#64748B"/><text x="412" y="94" fill="#0F172A">AI の帯</text><rect x="400" y="120" width="640" height="40" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="412" y="140" fill="#0F172A">見出し：このページは閲覧できません</text><rect x="400" y="170" width="640" height="60" rx="6" fill="#FEF9C3" stroke="#64748B"/><text x="412" y="190" fill="#0F172A">閲覧には、管理者から受け取った招待リンクが必要です。招待リンクを開き直してください。</text><rect x="400" y="240" width="640" height="50" rx="6" fill="#FFFFFF" stroke="#64748B"/><text x="412" y="260" fill="#0F172A">招待が取り消された場合は、管理者に連絡してください</text></svg>
